# HPC profile. Only the keys that differ from config/config.yaml.

input_vcf: ""
input_vcf_dir: ""
# Per-sample VCFs in different locations, one path per entry
input_vcf_list:
  - "/path/to/sample_1.vcf.gz"
  - "/path/to/sample_2.vcf.gz"

output_dir: "results"
log_dir: "results/logs"

qc:
  maf: 0.05
  max_missing: 0.01
  min_gq: 30
  min_dp: 30
  hwe_pval: 1.0e-5
